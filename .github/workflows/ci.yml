name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy src
      - name: Tests
        run: pytest -q tests
  alpha-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: qml-torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the alpha package
        run: python -m pip install -e ".[dev]"
      - name: Lint and test
        env:
          MPLBACKEND: Agg
        run: |
          ruff check src tests
          pytest -q
      - name: Build and validate distribution artifacts
        run: |
          python -m build
          python -m twine check --strict dist/qml_torch-*.whl dist/qml_torch-*.tar.gz
