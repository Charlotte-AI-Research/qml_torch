[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qml-torch"
version = "0.1.0"
description = "A beginner-friendly PyTorch interface for small hybrid quantum ML experiments"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pennylane>=0.35",
    "torch>=2.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
qml-torch = "qml_torch.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
