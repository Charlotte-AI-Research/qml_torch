[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qml-torch"
version = "0.1.0a2"
description = "A beginner-friendly PyTorch interface for small hybrid quantum ML experiments"
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Charlotte AI Research"},
]
keywords = ["quantum machine learning", "pytorch", "pennylane", "qml"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pennylane>=0.45,<0.46",
    "rich>=13.7",
    "torch>=2.2",
    "typer>=0.12",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.4",
    "ruff>=0.5",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Charlotte-AI-Research/qml_torch/tree/main/qml-torch"
Repository = "https://github.com/Charlotte-AI-Research/qml_torch"
Issues = "https://github.com/Charlotte-AI-Research/qml_torch/issues"
Changelog = "https://github.com/Charlotte-AI-Research/qml_torch/blob/main/qml-torch/CHANGELOG.md"

[project.scripts]
qml-torch = "qml_torch.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
